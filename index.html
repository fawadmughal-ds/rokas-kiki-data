<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kika Store Stock</title>
<style>
/* Layout: tabs across the top; Overview answers each client question with one chart; Products and Stores are ranked tables; Sales compares two days; Add data explains the CSV and uploads it. */
:root{--bg:#f5f7f6;--panel:#ffffff;--fg:#16211d;--muted:#5f6f69;--line:#dbe3df;--accent:#1f6f54;--accent-soft:#dcefe7;--bar:#2a78d6;--bar2:#eb6834;--warn:#a25b00;--warn-soft:#fbeed6;--bad:#b3392f;--bad-soft:#f8e1de;--zero:#9aa7a2;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--other:#8a9590;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#101614;--panel:#18211e;--fg:#e6eeea;--muted:#93a39d;--line:#2a3833;--accent:#58c29d;--accent-soft:#1d3a30;--bar:#3987e5;--bar2:#d95926;--warn:#f0b866;--warn-soft:#3a2c12;--bad:#f08b80;--bad-soft:#3d1c18;--zero:#5d6b66;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--other:#6f7b76;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font)}
.wrap{max-width:1500px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}
h2{margin:0;font-size:15px;text-wrap:balance}
.sub{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--fg);padding:7px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--panel);font-weight:600}
input[type=search],select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
input[type=search]{flex:1 1 220px}
.btn{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}
@media (max-width:600px){h1{font-size:19px}.seg{width:100%}.seg button{flex:1 1 auto;padding:8px 10px}.bar select{flex:1 1 140px}.tile b{font-size:18px}.pad{padding:12px}th,td{padding:6px 8px}.wrap{gap:12px}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--panel)}
th.s{cursor:pointer}th.s:hover{color:var(--fg)}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--accent-soft)}
tr.sel{background:var(--accent-soft)}
.t{font-weight:600}.v{color:var(--muted);font-size:12px}
.cov{display:flex;align-items:center;gap:8px;min-width:130px}
.cov i,.hb i{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:block}
.cov i u,.hb i u{display:block;height:100%;background:var(--bar)}
.cov b{width:54px;text-align:right;font-weight:600}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin-right:3px}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.z{color:var(--zero)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;color:var(--muted)}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.side a,.pad a{color:var(--accent)}
.hb{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb b{text-align:right;font-variant-numeric:tabular-nums;min-width:48px}
.hb.alt i u{background:var(--bar2)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 12px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:9px 12px}
.ok{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:9px 12px}
.wide{grid-column:1/-1}
.empty{padding:28px;text-align:center;color:var(--muted)}
pre{margin:0;font:12px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}
code{font-family:var(--mono);font-size:12px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Kika store stock</h1><span class="sub" id="sub"></span></header>
  <div class="bar">
    <div class="seg" id="tabs" role="group" aria-label="Section">
      <button data-v="overview" aria-pressed="true">Overview</button><button data-v="products" aria-pressed="false">Products</button><button data-v="stores" aria-pressed="false">Stores</button><button data-v="sales" aria-pressed="false">Sales estimate</button><button data-v="add" aria-pressed="false">Add data</button>
    </div>
  </div>
  <div class="bar" id="filters">
    <select id="date" aria-label="Day"></select>
    <div class="seg" id="pet" role="group" aria-label="Pet">
      <button data-p="0" aria-pressed="true">All</button><button data-p="1" aria-pressed="false">Dogs</button><button data-p="2" aria-pressed="false">Cats</button>
    </div>
    <input type="search" id="q" placeholder="Search product, variation, brand or SKU" aria-label="Search">
    <select id="cat" aria-label="Category"></select>
    <select id="brand" aria-label="Brand"></select>
    <select id="cover" aria-label="Store coverage">
      <option value="">Any coverage</option><option value="50">In 50+ stores</option><option value="20">In 20+ stores</option><option value="1">In at least 1 store</option><option value="low">In 1–5 stores</option><option value="0">In no stores</option><option value="na">Not collected</option>
    </select>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="note" id="note" hidden></div>
  <div id="view"></div>
</div>
<script src="echarts.min.js"></script>
<script>
const $=id=>document.getElementById(id),fmt=n=>n==null?'–':Math.round(n).toLocaleString('en-US'),eur=n=>'€'+fmt(n);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const PER=100,cache={};
let META={snapshots:[],files:[],folder:''},D=null;
const st={view:'overview',date:null,pet:0,q:'',cat:'',brand:'',cover:'',sort:'st',dir:-1,page:0,sel:null,ssort:'un',sdir:-1,store:null,from:null,to:null,xsort:'sold',msg:null};
let STATIC=false;
async function api(p,alt){if(!STATIC){try{const r=await fetch(p);if(r.ok&&(r.headers.get('content-type')||'').includes('json'))return r.json()}catch(e){}STATIC=true}const r=await fetch(alt);if(!r.ok)throw new Error('Request failed');return r.json()}
function shape(d){const S=d.stores;const rows=d.rows.map((r,i)=>{const q=r[10];let n=null,un=null;if(q){n=q.length/2;un=0;for(let j=1;j<q.length;j+=2)un+=q[j]}
  return {i,id:r[0],title:r[1],vr:r[2],brand:r[3],cat:r[4],sku:r[5],price:r[6],pet:r[7],buy:r[8],url:r[9],q,st:n,un,hay:(r[1]+' '+r[2]+' '+r[3]+' '+r[5]).toLowerCase()}});
  return {date:d.date,S,NS:S.length,rows,byId:new Map(rows.map(r=>[r.id,r]))}}
async function load(date){if(!cache[date])cache[date]=shape(await api('/api/data?date='+encodeURIComponent(date),'data/'+encodeURIComponent(date)+'.json'));return cache[date]}
function fill(sel,label,vals,keep){sel.replaceChildren(new Option(label,''));vals.forEach(v=>sel.add(new Option(v,v)));sel.value=vals.includes(keep)?keep:''}
function match(r){const q=st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return (!st.pet||(r.pet&st.pet))&&(!st.cat||r.cat===st.cat)&&(!st.brand||r.brand===st.brand)&&q.every(w=>r.hay.includes(w))&&
   (st.cover===''||(st.cover==='na'?r.st==null:st.cover==='low'?r.st>=1&&r.st<=5:st.cover==='0'?r.st===0:r.st!=null&&r.st>=+st.cover))}
const filtered=()=>D.rows.filter(r=>match(r)&&(st.store==null||(r.q&&unitsAt(r,st.store)>0)));
function unitsAt(r,s){for(let j=0;j<r.q.length;j+=2)if(r.q[j]===s)return r.q[j+1];return 0}
function tiles(list){const t=$('tiles');t.replaceChildren();list.forEach(([v,l])=>{const d=el('div','tile');d.append(el('b','',v),el('span','',l));t.append(d)})}
function stockTiles(rows){const ok=rows.filter(r=>r.st!=null),miss=rows.length-ok.length;
  tiles([[fmt(rows.length),'variations shown'],[fmt(ok.reduce((a,r)=>a+r.un,0)),'units in stores'],[eur(ok.reduce((a,r)=>a+(r.price||0)*r.un,0)),'stock value at shelf price'],
   [fmt(ok.filter(r=>r.st>0).length),'stocked in at least 1 store'],[fmt(ok.filter(r=>r.st===0).length),'in no store'],
   [ok.length?(ok.reduce((a,r)=>a+r.st,0)/ok.length).toFixed(1):'–','average stores per variation'],[fmt(ok.filter(r=>r.st===0&&r.buy===1).length),'online only (buyable, in no store)'],[fmt(miss),'not collected']]);
  note(miss?miss+' of the variations shown have no stock numbers for this day: the site stopped answering before they were read. They are listed as "Not collected" and left out of the totals.':'')}
function note(t){const n=$('note');n.hidden=!t;n.textContent=t}
function hbars(items,o={}){const box=el('div'),mx=Math.max(1,...items.map(x=>x.value));
  items.forEach(x=>{const d=el('div','hb'+(o.alt?' alt':'')),nm=el('span','',x.label);nm.title=x.title||x.label;const i=el('i'),u=el('u');u.style.width=(x.value/mx*100)+'%';i.append(u);d.append(nm,i,el('b','',(o.f||fmt)(x.value)+(x.suffix||'')));if(x.go){d.style.cursor='pointer';d.onclick=x.go}box.append(d)});
  if(!items.length)box.append(el('div','sub',o.empty||'Nothing to show for these filters.'));return box}
function card(q,sub,body){const c=el('div','card pad');c.append(el('h2','',q));if(sub)c.append(el('div','sub',sub));c.append(body);return c}
function group(rows,key,val){const m=new Map();rows.forEach(r=>{const k=key(r),v=val(r);if(v)m.set(k,(m.get(k)||0)+v)});return [...m].map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value)}
const name=r=>r.title+(r.vr?' — '+r.vr:'');
function pick(r){st.sel=r.i;st.view='products';st.q=r.sku||r.title;$('q').value=st.q;st.page=0;sync();draw()}

/* ---------- charts ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CATS=['Dry food','Wet food','Treats','Toys','Accessories','Supplies','Care products'],INK={'--s3':'#0b0b0b','--s4':'#0b0b0b','--s5':'#0b0b0b'};
const catVar=c=>{const i=CATS.indexOf(c);return i<0?'--other':'--s'+(i+1)};
const catList=rows=>{const have=new Set(rows.map(r=>r.cat));return [...CATS.filter(c=>have.has(c)),...[...have].filter(c=>!CATS.includes(c)).sort()]};
let live=[],pending=[];
function chart(h,opt,on){const d=el('div');d.style.cssText='width:100%;height:'+h+'px';pending.push([d,opt,on]);return d}
function mount(){pending.forEach(([d,opt,on])=>{if(!d.isConnected||!window.echarts)return;const c=echarts.init(d);c.setOption(opt(d.clientWidth));if(on)c.on('click',on);live.push({c,d,opt})});pending=[]}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>live.forEach(x=>{x.c.resize();x.c.setOption(x.opt(x.d.clientWidth))}),120)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>draw());
function base(){const fg=css('--fg'),mu=css('--muted'),ln=css('--line'),panel=css('--panel');return {fg,mu,ln,panel,
  ax:{axisLine:{lineStyle:{color:ln}},axisTick:{show:false},axisLabel:{color:mu,fontSize:11},splitLine:{lineStyle:{color:ln,type:'dashed'}},nameTextStyle:{color:mu,fontSize:11}},
  o:{textStyle:{fontFamily:css('--font'),color:fg},animationDuration:300,tooltip:{backgroundColor:panel,borderColor:ln,textStyle:{color:fg,fontSize:12},extraCssText:'max-width:340px;white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.18)',confine:true}}}}
const tip=(title,lines)=>'<b>'+esc(title)+'</b>'+lines.filter(Boolean).map(l=>'<br>'+esc(l)).join('');
function rank(items,o={}){if(!items.length)return el('div','sub',o.empty||'Nothing to show for these filters.');const f=o.f||fmt;
  return chart(items.length*28+12,w=>{const b=base(),lw=Math.min(o.lw||180,Math.round(w*.38));return {...b.o,grid:{left:lw+10,right:72,top:4,bottom:4},
    tooltip:{...b.o.tooltip,trigger:'item',formatter:p=>{const x=items[p.dataIndex];return tip(x.title||x.label,[f(x.value)+(x.suffix||'')+(o.unit?' '+o.unit:''),...(x.tip||[])])}},
    xAxis:{type:'value',...b.ax,axisLabel:{show:false},axisLine:{show:false}},
    yAxis:{type:'category',inverse:true,data:items.map(x=>x.label),axisLine:{show:false},axisTick:{show:false},axisLabel:{color:b.fg,width:lw,overflow:'truncate',fontSize:12}},
    series:[{type:'bar',data:items.map(x=>x.value),barWidth:14,cursor:items.some(x=>x.go)?'pointer':'default',itemStyle:{color:css(o.color||'--s1'),borderRadius:[0,4,4,0]},emphasis:{itemStyle:{opacity:.75}},
      label:{show:true,position:'right',color:b.fg,fontSize:12,formatter:p=>f(p.value)+(items[p.dataIndex].suffix||'')}}]}},p=>{const x=items[p.dataIndex];if(x&&x.go)x.go()})}
const ptip=r=>[r.brand+' · '+r.cat,r.st+' of '+D.NS+' stores',fmt(r.un)+' units',r.price!=null&&'€'+r.price.toFixed(2)+' each'];
function scatter(all){const ok=all.filter(r=>r.un>0);if(!ok.length)return el('div','sub','Nothing to show for these filters.');
  return chart(360,()=>{const b=base();return {...b.o,grid:{left:8,right:20,top:16,bottom:34,containLabel:true},
    tooltip:{...b.o.tooltip,trigger:'item',formatter:p=>{const r=ok[p.data[2]];return tip(name(r),ptip(r))}},
    xAxis:{type:'value',name:'Stores with stock',nameLocation:'middle',nameGap:28,min:0,max:D.NS,...b.ax},yAxis:{type:'log',name:'Units in stores (each step is 10× more)',min:1,...b.ax,axisLine:{show:false},minorSplitLine:{show:false}},
    series:[{type:'scatter',data:ok.map((r,i)=>[r.st,r.un,i]),symbolSize:7,cursor:'pointer',itemStyle:{color:css('--s1'),opacity:.4},emphasis:{itemStyle:{opacity:1,borderColor:b.panel,borderWidth:2}}}]}},p=>pick(ok[p.data[2]]))}
function hist(ok){if(!ok.length)return el('div','sub','Nothing to show for these filters.');const bins=[{l:'0',n:0}];for(let a=1;a<=D.NS;a+=5)bins.push({l:a+'–'+Math.min(a+4,D.NS),n:0});
  ok.forEach(r=>bins[r.st===0?0:Math.ceil(r.st/5)].n++);
  return chart(280,()=>{const b=base();return {...b.o,grid:{left:8,right:12,top:28,bottom:30,containLabel:true},
    tooltip:{...b.o.tooltip,trigger:'item',formatter:p=>tip(p.name==='0'?'In no store':'In '+p.name+' stores',[fmt(p.value)+' variations',(p.value/ok.length*100).toFixed(1)+'% of those shown'])},
    xAxis:{type:'category',data:bins.map(x=>x.l),name:'Number of stores holding the variation',nameLocation:'middle',nameGap:bins.length>12?46:28,...b.ax,axisLabel:{color:b.mu,fontSize:10,interval:0,rotate:bins.length>12?45:0}},
    yAxis:{type:'value',name:'Variations',...b.ax,axisLine:{show:false}},
    series:[{type:'bar',data:bins.map(x=>x.n),barCategoryGap:'18%',itemStyle:{color:css('--s1'),borderRadius:[4,4,0,0]},emphasis:{itemStyle:{opacity:.75}}}]}})}
function tree(ok){const m=new Map();ok.forEach(r=>{const v=r.un*(r.price||0);if(!v)return;const c=m.get(r.cat)||new Map();c.set(r.brand,(c.get(r.brand)||0)+v);m.set(r.cat,c)});
  if(!m.size)return el('div','sub','No priced stock for these filters.');
  return chart(420,()=>{const b=base();const data=catList(ok).filter(c=>m.has(c)).map(c=>{const col=css(catVar(c)),ink=INK[catVar(c)]||'#ffffff',kids=[...m.get(c)].sort((x,y)=>y[1]-x[1]),rest=kids.slice(8).reduce((a,x)=>a+x[1],0);
      const ch=kids.slice(0,8).map(([n,v])=>({name:n,value:v,cat:c}));if(rest)ch.push({name:'Other brands',value:rest,cat:c});
      return {name:c,value:ch.reduce((a,x)=>a+x.value,0),itemStyle:{borderColor:b.panel},children:ch.map(x=>({...x,itemStyle:{color:col},label:{color:ink}}))}});
    return {...b.o,tooltip:{...b.o.tooltip,formatter:p=>tip(p.data.cat?p.data.cat+' · '+p.name:p.name,[eur(p.value)+' at shelf price'])},
      series:[{type:'treemap',data,roam:false,nodeClick:false,breadcrumb:{show:false},left:0,right:0,top:0,bottom:0,
        label:{show:true,formatter:p=>p.name+'\n'+eur(p.value),fontSize:11,lineHeight:15,overflow:'truncate'},
        upperLabel:{show:true,height:22,color:b.fg,fontSize:12,fontWeight:600,formatter:p=>p.name+'  '+eur(p.value)},
        levels:[{itemStyle:{borderWidth:0,gapWidth:6}},{itemStyle:{borderWidth:0,gapWidth:2,borderColor:b.panel}},{itemStyle:{borderWidth:0,gapWidth:2}}]}]}})}
function storeStack(ok){const cats=catList(ok),agg=D.S.map((x,i)=>({i,name:x[0],tot:0,c:{}}));ok.forEach(r=>{for(let j=0;j<r.q.length;j+=2){const a=agg[r.q[j]];a.tot+=r.q[j+1];a.c[r.cat]=(a.c[r.cat]||0)+r.q[j+1]}});
  const top=agg.filter(a=>a.tot).sort((a,b)=>b.tot-a.tot).slice(0,12);if(!top.length)return el('div','sub','Nothing to show for these filters.');
  return chart(top.length*28+64,w=>{const b=base(),lw=Math.min(220,Math.round(w*.36));return {...b.o,legend:{top:0,left:0,type:'scroll',itemWidth:10,itemHeight:10,textStyle:{color:b.fg,fontSize:12}},grid:{left:lw+10,right:24,top:44,bottom:24},
    tooltip:{...b.o.tooltip,trigger:'axis',axisPointer:{type:'shadow'},valueFormatter:v=>fmt(v)+' units'},
    xAxis:{type:'value',...b.ax,axisLine:{show:false}},yAxis:{type:'category',inverse:true,data:top.map(a=>a.name),axisLine:{show:false},axisTick:{show:false},axisLabel:{color:b.fg,width:lw,overflow:'truncate',fontSize:12}},
    series:cats.map(c=>({name:c,type:'bar',stack:'t',barWidth:16,cursor:'pointer',data:top.map(a=>a.c[c]||0),itemStyle:{color:css(catVar(c)),borderColor:b.panel,borderWidth:1}}))}},
    p=>{const a=top[p.dataIndex];if(a){st.store=a.i;st.view='products';st.page=0;draw()}})}
function split(parts){const tot=parts.reduce((a,x)=>a+x.value,0);if(!tot)return el('div','sub','Nothing to show for these filters.');
  return chart(120,()=>{const b=base();return {...b.o,legend:{top:0,left:0,itemWidth:10,itemHeight:10,textStyle:{color:b.fg,fontSize:12}},grid:{left:4,right:4,top:40,bottom:4},
    tooltip:{...b.o.tooltip,trigger:'item',formatter:p=>tip(p.seriesName,[fmt(p.value)+' variations',(p.value/tot*100).toFixed(1)+'% of the range'])},
    xAxis:{type:'value',max:tot,show:false},yAxis:{type:'category',data:[''],show:false},
    series:parts.map((x,i)=>({name:x.label,type:'bar',stack:'t',barWidth:44,data:[x.value],itemStyle:{color:css(x.color),borderColor:b.panel,borderWidth:1,borderRadius:i===0?[4,0,0,4]:i===parts.length-1?[0,4,4,0]:0},

  fill($('brand'),'All brands',[...new Set(D.rows.map(r=>r.brand))].sort((a,b)=>a.localeCompare(b)),st.brand);st.brand=$('brand').value;
  $('sub').textContent='Snapshot of '+d+' · '+D.NS+' locations · '+META.snapshots.length+' day'+(META.snapshots.length===1?'':'s')+' loaded'}
async function refresh(want){META=await api('/api/snapshots','data/snapshots.json');const ds=META.snapshots.map(s=>s.date),sel=$('date');sel.replaceChildren();ds.forEach(d=>sel.add(new Option('Day: '+d,d)));
  if(!ds.length){D=null;$('sub').textContent='No data loaded';return}const d=ds.includes(want)?want:ds[ds.length-1];sel.value=d;await setDate(d)}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){st.view=b.dataset.v;st.msg=null;draw()}};
$('pet').onclick=e=>{const b=e.target.closest('button');if(b){st.pet=+b.dataset.p;st.page=0;draw()}};
$('date').onchange=async e=>{await setDate(e.target.value);draw()};
let tm;$('q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=e.target.value;st.page=0;draw()},150)};
['cat','brand','cover'].forEach(k=>$(k).onchange=e=>{st[k]=e.target.value;st.page=0;draw()});
if(['overview','products','stores','sales','add'].includes(location.hash.slice(1)))st.view=location.hash.slice(1);
refresh().then(draw).catch(()=>{$('view').replaceChildren(el('div','err','The dashboard could not load its data. Start it with "python3 server.py" and open http://localhost:8765.'))});
</script>
